<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>London Market Music Network</title>
  <meta name="description" content="London Market Music Network — a new project connecting our market through music. Website launching soon." />
  <style>
    :root {
      --bg: #050505;
      --text: #ffffff;
      --muted: #cfcfcf;
      --line: rgba(255,255,255,.16);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,.05), transparent 40%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 28px;
    }

    main {
      width: min(1080px, 100%);
      text-align: center;
    }

    .brand {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 10px 28px rgba(0,0,0,.32));
    }

    .content {
      margin: clamp(12px, 2vw, 22px) auto 0;
      max-width: 760px;
    }

    .eyebrow {
      margin: 0 0 8px;
      letter-spacing: .26em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4.6vw, 54px);
      line-height: 1.04;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .intro {
      max-width: 680px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 1.9vw, 20px);
      line-height: 1.55;
    }

    .footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: #9f9f9f;
      font-size: 13px;
      letter-spacing: .08em;
    }

    .footer strong {
      color: #dddddd;
      font-weight: 500;
    }

    @media (max-width: 720px) {
      body { padding: 18px; }
      .brand { width: 114%; margin-left: -7%; }
      .content { margin-top: 8px; }
      h1 { font-size: clamp(26px, 9vw, 40px); }
    }

    @media (prefers-reduced-motion: no-preference) {
      main { animation: fadeIn .8s ease-out both; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
