<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>London Market Music Network</title>
  <meta name="description" content="London Market Music Network — connecting people across the London Market through music, events, collaboration and opportunity.">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      margin: 0 auto;
      overflow-x: hidden;
    }

    .hero {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      margin: 0;
      padding: 0;
    }

    .hero img {
      display: block;
      width: 100%;
      max-width: 1536px;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
      object-position: center center;
    }

    .content {
      width: min(760px, calc(100% - 48px));
      margin: 0 auto;
      padding: 24px 0 56px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 22px;
      font-size: clamp(15px, 3.7vw, 23px);
      letter-spacing: 0.28em;
      font-weight: 400;
      color: #cfcfcf;
    }

    h1 {
      margin: 0 auto 28px;
      max-width: 680px;
      font-size: clamp(46px, 9vw, 76px);
      line-height: 0.98;
      letter-spacing: -0.035em;
      font-weight: 800;
      text-align: center;
    }

    .intro {
      margin: 0 auto;
      max-width: 700px;
      font-size: clamp(20px, 4.4vw, 29px);
      line-height: 1.55;
      color: #d2d2d2;
      text-align: center;
    }

    .rule {
      width: 100%;
      height: 1px;
      background: #333;
      margin: 52px auto 36px;
    }

    .url {
      font-size: clamp(18px, 4vw, 25px);
      letter-spacing: 0.03em;
      color: #eee;
      text-decoration: none;
      word-break: break-word;
    }

    @media (max-width: 600px) {
      .content {
        width: min(100% - 42px, 760px);
        padding-top: 20px;
      }

      .hero img {
        width: 100%;
      }

      .eyebrow {
        margin-bottom: 20px;
      }

      h1 {
        margin-bottom: 24px;
      }

      .rule {
        margin-top: 46px;
      }
    }
  </style>
</head>
